name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.service }} — typecheck & tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: payments
            db: sendkoro_test
          - service: api
            db: sendkoro_api_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.db }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: ${{ matrix.app }} — typecheck & build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer-web, restaurant-web, admin-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      NEXT_PUBLIC_API_URL: https://api.sendkoro.com/v1
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
